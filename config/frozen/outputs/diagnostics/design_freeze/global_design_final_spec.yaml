benchmark_spec_reference: outputs/diagnostics/benchmark_freeze/benchmark_final_spec.yaml
benchmark_spec_sha256: 1ac1c3b715a6ce7ec7aaf6ab3855e4832153a4b2eef1fefecccdad12ddd5e590
benchmark_formula:
  return: C_t / C_(t-1) - 1
  adjacency_minutes: 1
  covariance_lag: 1
  ddof: 1
  minimum_covariance_pairs: 2
  negative_gamma: 2*sqrt(-gamma)
  bps: 10000*relative
  nonnegative_gamma: NaN; benchmark_defined=False; non_negative_autocovariance
  insufficient_pairs: NaN; benchmark_defined=False; preserve failure reason
  sessions: Existing latest verified class session specifications only; no cross-day/session/contract
    pairs
primary_roll_pair_threshold: 2
higher_primary_pair_threshold_allowed: false
design_eligible_definition: Frozen selected asset AND exact frozen class primary date
  AND required source day/session exists; independent of all method outcomes
benchmark_defined_definition: Only frozen Roll computability and strictly negative
  lag-one covariance; undefined outcomes remain in design coverage
estimator_defined_definition: Separate cs_defined, ar_defined, edge_defined and method-specific
  failure reasons under each published/raw-output policy; not inferred from another
  method
common_defined_accuracy_sample_definition: design_eligible AND benchmark_defined AND
  cs_defined AND ar_defined AND edge_defined
failure_rate_denominator: All design_eligible asset-days, separately for Roll, CS,
  AR and EDGE; no outcome conditioning
missing_data_policy: No OHLC imputation, carry-forward, minute/day synthesis, gap
  bridging or compression; preserve partial rows, source errors and all quality diagnostics;
  estimator windows require valid scheduled adjacency
corporate_action_policy:
  evidence: Reuse Step-8 corporate_action_checks.csv; do not rerun factor detection
  candidate_threshold: Existing Step-8 >=1% adjacent observed close adjustment-factor
    change; audit screen only, not event identification or performance tuning
  verified_example: SNDL 2022-07-26 saved acquisition reverse-split checks
  primary_adjusted: All 61 empirical flags remain diagnostics only. No automatic exclusion;
    only independently verified AND methodologically required event boundaries may
    break primary windows.
  unadjusted_robustness: Explicitly break the saved verified SNDL split; future verified
    split/capital boundaries may be broken with documented evidence. Heuristic flags
    alone never break windows.
  primary_breaks_currently_imposed: 0
  robustness_verified_breaks_currently_imposed: 1
  incoming_edge_rule: An explicitly imposed event boundary is an incoming edge to
    the first post-event session; diagnostic candidates do not imply a break.
  missing_event_session: If an explicitly imposed boundary date is missing, the first
    later observation receives the applicable role-specific break flag
  exclusion_scope: Preserve source rows and diagnostic flags; no automatic event-month
    deletion or heuristic exclusion; future primary breaks require verification and
    a recorded methodological reason
  identity: Factor candidates remain unverified; no inferred split/dividend labels
  diagnostic_candidate_count: 61
  general_guarantee: No complete corporate-action ledger or blanket price-continuity
    guarantee is inferred from heuristic flags. Use saved vendor capital adjustment;
    additional primary event breaks require verification and methodological necessity.
futures_contract_policy:
  missing_contract_policy: Source-unavailable dates remain audited; no substitution,
    missing-bar filling or synthesized trade dates
  continuous_price_policy: Individual unadjusted contracts only; all continuous-price
    files, including back-adjusted files, prohibited
  roll_mapping_policy: Exact provider daily trade-date mapping; one selected individual
    contract for the entire overnight session; no forward-filled mapping or intraday
    mixing
  session_rule_policy:
    timezone: America/New_York
    primary_open: 18:00 previous calendar day inclusive
    primary_close: 17:00 trade date exclusive
    maintenance: 17:00 <= local time < 18:00 excluded
    trade_date_assignment: 'time >=18:00: calendar date +1; time <17:00: calendar
      date; maintenance excluded'
    configuration: src/futures_historical_sessions.py:historical_configs; explicit
      root-specific rules required
    rules_artifact: historical/historical_session_rules.csv
    primary_rule_ids:
      HG: HG_2015-09-21_2025-12-31
      AD: AD_2024-01-01_2024-12-31
      B6: B6_2024-01-01_2024-12-31
      J1: J1_2024-01-01_2024-12-31
      GC: GC_2015-09-21_2025-12-31
      E6: E6_2024-01-01_2024-12-31
      NQ: NQ_2021-06-28_2025-12-31
      ZF: ZF_2024-01-01_2024-12-31
      ES: ES_2021-06-28_2025-12-31
    historical_policy: Use verified date-effective intervals only; exclude/audit unresolved
      dates; no extrapolation
    equity_pause: ES/NQ pre-2021-06-28 pause remains historical only; no afternoon
      pause in 2024
    calendar_scope: Regular primary-session envelope; exhaustive historical holiday/early-close
      settlement-date overrides remain uncertified
