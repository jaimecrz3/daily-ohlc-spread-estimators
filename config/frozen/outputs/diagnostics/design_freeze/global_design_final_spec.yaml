  status: VERIFIED_COMMON_PROVIDER_QUOTE_BASIS
  quote_currency: UNKNOWN
  literal_USD_claim_allowed: false
fx_policy:
  in_scope: true
  status: BLOCKED_OFFICIAL_SOURCE_ACCESS
  substitute_fx_allowed: false
  professor_instruction_basis: Student-supplied professor instruction, Step14; no
    independent verification claimed
  submission_treatment: Continue other classes; document inaccessible official FX
    and present completed components; student reports no penalty for this access limitation
  not_intentional_class_exclusion: true
  access_audit: outputs/diagnostics/final_universe/fx_final/fx_access_audit.csv
primary_estimands:
  future_outputs:
  - bias versus Roll
  - MAE
  - RMSE
  - estimator failure/undefined rate
  - negative-estimate rate where meaningful under published/raw output definition
  accuracy_definitions:
    signed_error: estimate - Roll
    bias: mean(signed_error)
    MAE: mean(abs(signed_error))
    RMSE: sqrt(mean(signed_error**2))
    sample: Identical common_defined_accuracy_sample for all three methods
  groupings:
  - overall
  - asset class
  - liquidity tier
  - asset class x liquidity tier
  units:
  - basis points
  - relative price
  accuracy_sample: common_defined_accuracy_sample
  failure_sample: design_eligible
  inferential_uncertainty: HAC standard errors
  HAC_lag: PENDING_METHOD_CONVENTION_NOT_RESULT_OPTIMIZATION
robustness_only_components:
- Bloomberg unadjusted OHLC
- cross-fitted error model
- Prespecified later higher Roll-pair reliability cutoffs; never replace primary
- Successive-observed-bar benchmark sensitivity, not primary
- Method-specific author preprocessing replication if separately authorized
supplementary_history_role: Earlier/later asset-specific history outside class primary
  calendars is descriptive only; do not pool changing composition as a liquidity effect
look_ahead_limitations:
- All tiers use 2024 calibration; pre-2024 stocks/ETF/crypto labels are ex-post and
  use future information
- Futures primary comparison is conditional on the 2024 calibration year, not out
  of sample
- No benchmark or estimator performance influenced selection
source_dependence_limitation: Futures and crypto daily OHLC and Roll share local one-minute
  source; mechanical dependence must be discussed later
remaining_pre_estimation_decisions:
- Resolve estimator-specific published formulas, window lengths, warm-up requirements,
  numerical tolerances, negative/raw-output treatment and failure reasons before provider
  estimator calculation; never tune to outcomes.
- Validate scheduled-session/date adjacency for each estimator window, including exchange
  closures and omitted source sessions; common observed dates must never compress
  gaps. Preserve context outside the evaluation calendar when needed for legitimate
  lags; score endpoints only on frozen primary dates.
- Specify HAC lag convention and applicable time-series aggregation/dependence structure
  before inference; no empirical-result lag optimization or HAC implementation here.
- Specify overall/group weighting and aggregation of errors plus the negative-estimate-rate
  denominator and published-output meaning before producing summaries; never silently
  use successful-only denominators for failure rates.
- Retain IMDX/OCX stable-ID stitching uncertainty; no manual ticker-history stitching
  or universe replacement. Source availability does not certify economic identity.
- FX official access must be restored and its session, denomination and liquidity
  comparability validated before an FX freeze; other four classes can proceed.
implementation_scope: Global design frozen; statistical/numerical decisions listed
  here must be resolved before relevant provider calculations or inference
precedence: Step14 resolves prior comparison-eligibility pending fields and extends
  earlier pilot-only session descriptions by reference to later freezes; prior artifacts
  retained unchanged
no_benchmark_or_estimator_values_calculated: true
