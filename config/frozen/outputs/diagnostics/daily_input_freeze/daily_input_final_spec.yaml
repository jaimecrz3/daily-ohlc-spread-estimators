common_source_enforcement:
  primary:
    CS: adjusted
    AR: adjusted
    EDGE: adjusted
  robustness:
    CS: unadjusted
    AR: unadjusted
    EDGE: unadjusted
  per_estimator_convention_switching: false
required_fields_policy:
  CS:
  - PX_HIGH
  - PX_LOW
  - PX_LAST
  AR:
  - PX_HIGH
  - PX_LOW
  - PX_LAST
  EDGE:
  - PX_OPEN
  - PX_HIGH
  - PX_LOW
  - PX_LAST
  CS_close_role: Prior close needed for official overnight correction
  window_admission: Required-field validity AND validated calendar/date adjacency;
    field flags alone never admit a window
capital_change_policy: Primary uses saved CapChg=T unchanged. No automatic heuristic
  or verified-split break in adjusted inputs; impose an event boundary only when independently
  verified and methodologically required. Unadjusted robustness explicitly breaks
  the saved verified SNDL split edge.
normal_dividend_policy: Primary uses saved CshAdjNormal=T; robustness F. Accept vendor-acquired
  convention unchanged; no additional dividend adjustment.
abnormal_dividend_policy:
  status: unknown_not_explicitly_set
  primary_use: documented limitation; not a blocker to using this immutable acquisition
    as a precisely identified source
  forbidden_claim: Do not label this as explicitly all-dividend adjusted or infer
    a Bloomberg default
  setting: UNKNOWN
  sensitivity: Existing unadjusted source with explicit verified split/capital-change
    breaks only; cannot isolate abnormal from normal/capital adjustment effects
  unresolved_risk: Undetected special distributions are possible; event verification
    alone does not automatically require a primary break; document methodological
    necessity first
  reextraction_required: false
partial_row_policy: Keep physical rows, raw tokens and source errors; no OHLC imputation
  or carry-forward. Each estimator window must satisfy its own required fields plus
  valid calendar/date adjacency; no blanket complete-OHLC gate for CS/AR. Missing
  volume or quotes alone does not gate price inputs.
missing_day_policy: Preserve missing/partial sessions and source-only dates without
  compression, carry-forward, interpolation or OHLC synthesis; no daily grid materialized
  here.
author_preprocessing_robustness: Method-specific author carry-forward/range replacement
  and other empirical preprocessing remain possible later explicitly authorized robustness
  replications only; not the common primary horse-race policy and not implemented
  here.
calendar_gap_policy:
  ordering: Stable asset/date/source_row ordering; do not drop invalid rows before
    lag construction
  adjacency: Future lags use consecutive scheduled sessions, not consecutive available
    rows; known missing scheduled sessions break chains
  weekends_holidays: Do not treat weekends/holidays as missing trading days; require
    a validated listed-line session calendar before confirming adjacency across closures
  unresolved_calendar: No new exchange calendar frozen here. Unknown adjacency must
    be flagged and not silently treated as consecutive.
  edge_grid: At later implementation, retain NaN placeholders on an explicitly validated
    regular session grid as an analysis view; no invented OHLC or inserted intraday
    bars
corporate_action_boundary_policy:
  evidence: Reuse Step-8 corporate_action_checks.csv; do not rerun factor detection
  candidate_threshold: Existing Step-8 >=1% adjacent observed close adjustment-factor
    change; audit screen only, not event identification or performance tuning
  verified_example: SNDL 2022-07-26 saved acquisition reverse-split checks
  primary_adjusted: All 61 empirical flags remain diagnostics only. No automatic exclusion;
    only independently verified AND methodologically required event boundaries may
    break primary windows.
  unadjusted_robustness: Explicitly break the saved verified SNDL split; future verified
    split/capital boundaries may be broken with documented evidence. Heuristic flags
    alone never break windows.
  primary_breaks_currently_imposed: 0
  robustness_verified_breaks_currently_imposed: 1
  incoming_edge_rule: An explicitly imposed event boundary is an incoming edge to
    the first post-event session; diagnostic candidates do not imply a break.
  missing_event_session: If an explicitly imposed boundary date is missing, the first
    later observation receives the applicable role-specific break flag
  exclusion_scope: Preserve source rows and diagnostic flags; no automatic event-month
    deletion or heuristic exclusion; future primary breaks require verification and
    a recorded methodological reason
  identity: Factor candidates remain unverified; no inferred split/dividend labels
  diagnostic_candidate_count: 61
  general_guarantee: No complete corporate-action ledger or blanket price-continuity
    guarantee is inferred from heuristic flags. Use saved vendor capital adjustment;
    additional primary event breaks require verification and methodological necessity.
source_comparability_role: First Rate split+dividend adjusted RTH daily aggregates
  are validation only, never the primary stock/ETF estimator source; no vendor session/adjustment
  equivalence assumed
zero_range_policy: Retain and flag; no author-style range replacement. Future estimator-specific
  computability rules require a separate numerical implementation review.
negative_estimate_policy: Original-source policies documented only; project CS/AR/EDGE
  output treatment not frozen or executed here
benchmark_link: benchmark_final_spec.yaml unchanged; Roll two-pair mathematical minimum
  does not define comparison eligibility
no_estimator_result_dependency: true
estimator_values_calculated: false
candidate_blocked: false
blocker_reason: null
limitations:
- Abnormal-dividend behavior is unspecified, not resolved by source selection
- IMDX/OCX stable-ID continuity unresolved; no manual historical stitching
- Bloomberg EOD/session/auction timing and First Rate equivalence not certified
- Volume adjustment differences are separate from price-only input availability
- Scheduled-session calendar, window lengths, estimator output treatment and final
  analytical eligibility remain separate approvals
- This candidate differs from original empirical imputation, split-month exclusion
  and aggregation conventions
