    ZF: ZF_2024-01-01_2024-12-31
    ES: ES_2021-06-28_2025-12-31
  historical_policy: Use verified date-effective intervals only; exclude/audit unresolved
    dates; no extrapolation
  equity_pause: ES/NQ pre-2021-06-28 pause remains historical only; no afternoon pause
    in 2024
  calendar_scope: Regular primary-session envelope; exhaustive historical holiday/early-close
    settlement-date overrides remain uncertified
methodological_limitations:
- 2024 is also the liquidity-calibration year; primary futures analysis is conditional
  on that calendar year
- This is not an out-of-sample liquidity-tier evaluation
- Historical sessions for AD/B6/J1/E6/ZF outside 2024 remain unresolved
- Missing late-2025 individual contracts remain source-unavailable
- No substitutions or extrapolated session rules permitted
- Common dates reduce calendar confounding but do not remove product-family/root confounding
  or one-year regime limitations
